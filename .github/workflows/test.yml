name: program tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  litesvm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # program/target/deploy/commish.so is gitignored, so CI builds it.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
            ~/.cargo/registry
            ~/.cargo/git
            program/target
          key: sbf-v4.1.2-tools-v1.54-${{ runner.os }}-${{ hashFiles('program/Cargo.lock') }}

      # Pinned: the mainnet binary was built with Solana 4.1.2 / platform-tools v1.54.
      # Newer platform-tools reject the panic_immediate_abort build flag.
      - name: Install Solana CLI 4.1.2 (Anza)
        run: |
          if [ ! -x "$HOME/.local/share/solana/install/active_release/bin/cargo-build-sbf" ]; then
            sh -c "$(curl -sSfL https://release.anza.xyz/v4.1.2/install)"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: program/package-lock.json

      - name: Build program (cargo build-sbf)
        working-directory: program
        run: |
          cargo-build-sbf --version
          RUSTC_BOOTSTRAP=1 cargo-build-sbf --tools-version v1.54 -- -Zbuild-std=core -Zbuild-std-features=panic_immediate_abort
          ls -l target/deploy/commish.so

      # The first 9,280 bytes of the mainnet program account (the rest is zero padding).
      - name: Build matches the mainnet binary
        working-directory: program
        run: |
          echo "126d294003644c26ee27d90e5cbfc09c0c9c5ca996906ba3bf8c5a416f852ac8  target/deploy/commish.so" | sha256sum -c -

      - name: LiteSVM tests
        working-directory: program
        run: |
          npm ci
          npm test
